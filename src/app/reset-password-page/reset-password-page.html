<app-dialog 
    dialogTitle="Resetowanie hasła" 
    dialogHint="Wprowadź nowe hasło" 
    [dialogOpen]="dialogOpen()" 
    (closeDialog)="closeDialog()"
    (continueClick)="resetPassword()" 
    [isReady]="isResetReady()" 
    [errorMessage]="errorMessage()">

    <input autocomplete="off" placeholder="Nowe hasło" [value]="password()" (input)="updatePassword($event)">
    <input autocomplete="off" placeholder="Powtórz hasło" [value]="repeatPassword()" (input)="updateRepeatPassword($event)">

</app-dialog>
