<div id="create-post">
    <div id="create-post-leftside">
        <img alt="profilepic" [src]="'http://' + loggedInProfile().image" width="40" height="40" loading="lazy">
    </div>
    <div id="create-post-rightside">
        <div id="create-post-content">
            <app-create-post-textarea [(text)]="postTextContent"></app-create-post-textarea>
            @if (this.imageCount() > 0) {
                <div id="image-grid" [class]="'grid' + imageCount()">
                    @for (img of this.imageUrls(); track $index; let i = $index) {
                        <div class="image-grid-item" style="background-image: url({{img}});" [style.--aspect-ratio]="firstImageAspectRatio()">
                            <button type="button" class="remove-image-btn" (click)="removeImage(i)">
                                <svg viewBox="0 0 24 24" aria-hidden="true" fill="white"><path d="M10.59 12L4.54 5.96l1.42-1.42L12 10.59l6.04-6.05 1.42 1.42L13.41 12l6.05 6.04-1.42 1.42L12 13.41l-6.04 6.05-1.42-1.42L10.59 12z"></path></svg>
                            </button>
                        </div>
                    }
                </div>
            }
        </div>
        <div id="create-post-controls">
            <input type="file" id="create-post-img" (input)="addImageToPost($event)" accept="image/*" [disabled]="imageCount() >= 4">
            <label for="create-post-img" class="imgBtn" [class.disabled]="imageCount() >= 4">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="whitesmoke"><path d="M15 7c1.105 0 2 .895 2 2s-.895 2-2 2-2-.895-2-2 .895-2 2-2z"></path><path clip-rule="evenodd" d="M14.1 2.5c1.103 0 1.991-.001 2.709.058.728.06 1.368.185 1.96.487.941.48 1.707 1.245 2.186 2.185.302.593.428 1.233.487 1.961.059.718.058 1.606.058 2.71V14.1c0 1.103.001 1.991-.058 2.709-.06.728-.185 1.368-.487 1.96-.48.941-1.245 1.707-2.185 2.186-.593.302-1.233.428-1.961.487-.718.059-1.606.058-2.71.058H9.9c-1.103 0-1.991.001-2.709-.058-.728-.06-1.368-.185-1.96-.487-.941-.48-1.707-1.245-2.186-2.185-.302-.593-.428-1.233-.487-1.961-.059-.718-.058-1.606-.058-2.71V9.9c0-1.103-.001-1.991.058-2.709.06-.728.185-1.368.487-1.96.48-.941 1.245-1.707 2.185-2.186.593-.302 1.233-.428 1.961-.487.718-.059 1.606-.058 2.71-.058H14.1zM4.506 15.442c.006.473.017.865.045 1.203.05.606.142.954.276 1.217.288.565.746 1.023 1.31 1.31.264.135.612.228 1.217.277.617.05 1.41.051 2.546.051h4.2c.36 0 .685-.003.981-.005L7.96 12.373l-3.453 3.07zM9.9 4.5c-1.136 0-1.929 0-2.546.05-.605.05-.953.143-1.216.277-.565.288-1.023.746-1.31 1.31-.135.264-.228.612-.277 1.217C4.5 7.971 4.5 8.764 4.5 9.9v2.873l3.54-3.147 9.63 9.63c.07-.026.133-.053.192-.083.565-.288 1.023-.746 1.31-1.31.135-.264.228-.612.277-1.218.05-.616.051-1.409.051-2.545V9.9c0-1.136 0-1.929-.05-2.546-.05-.605-.143-.953-.277-1.216-.288-.565-.746-1.023-1.31-1.31-.264-.135-.612-.228-1.218-.277C16.03 4.5 15.236 4.5 14.1 4.5H9.9z" fill-rule="evenodd"></path></svg>
            </label>
            <button type="button" id="post" [disabled]="postButtonDisabled()" (click)="clickPost()">Postuj</button>
        </div>
    </div>
</div>
